<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6e6e3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#232325" media="(prefers-color-scheme: dark)">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:card" content="summary">
    <title>{{ page.title }} · {{ site.title }}</title>
    <script>
      // Applied before the page is drawn, so a chosen theme doesn't flash. No choice means the system theme.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <header class="bar">
      <a class="name" href="{{ '/' | relative_url }}">scuttle</a>
      <nav class="spaces" aria-label="Pages">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">0<span>intro</span></a>
        <a {% if page.url contains '/concepts/' %}aria-current="page"{% endif %} href="{{ '/concepts/' | relative_url }}">1<span>concepts</span></a>
        <a {% if page.url contains '/columns/' %}aria-current="page"{% endif %} href="{{ '/columns/' | relative_url }}">2<span>columns</span></a>
        <a {% if page.url contains '/configuration/' %}aria-current="page"{% endif %} href="{{ '/configuration/' | relative_url }}">3<span>config</span></a>
        <a {% if page.url contains '/commands/' %}aria-current="page"{% endif %} href="{{ '/commands/' | relative_url }}">4<span>commands</span></a>
        <a {% if page.url contains '/changelog/' %}aria-current="page"{% endif %} href="{{ '/changelog/' | relative_url }}">5<span>changelog</span></a>
      </nav>
      <div class="end">
        <div class="theme" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system">system</button>
          <button type="button" data-theme-choice="light">light</button>
          <button type="button" data-theme-choice="dark">dark</button>
        </div>
        <a class="repo" href="https://github.com/ahacop/scuttle">github</a>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <script>
      (function () {
        var root = document.documentElement;
        var buttons = document.querySelectorAll("[data-theme-choice]");
        function show(choice) {
          buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.themeChoice === choice)); });
        }
        buttons.forEach(function (b) {
          b.addEventListener("click", function () {
            var choice = b.dataset.themeChoice;
            if (choice === "system") delete root.dataset.theme; else root.dataset.theme = choice;
            try {
              if (choice === "system") localStorage.removeItem("theme"); else localStorage.setItem("theme", choice);
            } catch (e) {}
            show(choice);
          });
        });
        show(root.dataset.theme || "system");
      })();
    </script>
  </body>
</html>
