<!doctype html>
<!-- The docs' link-preview banner (og:image), 1200×630. Render it with Design/banner/render.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f4f2;
    --bar: #e6e6e3;
    --fg: #222321;
    --dim: #6c6d69;
    --line: #d3d3cf;
    --accent: #0e7c66;
    --code: #ebebe8;
    --tile: #fbfbfa;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--fg);
    font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  .bar {
    position: absolute; inset: 0 0 auto; height: 90px; background: var(--bar);
    display: flex; align-items: center; gap: 31px; padding: 0 48px; font-size: 24px;
  }
  .bar b { font-weight: 500; margin-right: 12px; }
  .bar i { font-style: normal; color: var(--dim); }
  .bar i.on { color: var(--bg); background: var(--accent); padding: 0 10px; border-radius: 5px; }
  .head { position: absolute; left: 48px; top: 144px; display: flex; gap: 42px; align-items: center; }
  .head img { width: 204px; height: 204px; }
  .word { font-size: 103px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
  .tag { font-size: 28px; color: var(--dim); margin-top: 20px; line-height: 1.4; }
  svg { position: absolute; left: 0; bottom: 0; width: 1200px; height: 230px; }
</style>
</head>
<body>
  <div class="bar"><b>scuttle</b><i>0 intro</i><i>1 concepts</i><i class="on">2 columns</i><i>3 config</i><i>4 commands</i></div>
  <div class="head">
    <img src="../../docs/assets/icon.png" alt="">
    <div>
      <div class="word">scuttle</div>
      <div class="tag">A scrolling tiling window manager for macOS.</div>
    </div>
  </div>
  <!-- A strip of columns: two in view, the focused one green, one hanging off each edge of the display. -->
  <svg viewBox="0 0 1200 230" aria-hidden="true">
    <rect x="250" y="20" width="700" height="260" rx="14" fill="var(--code)" stroke="var(--line)" stroke-width="3"/>
    <rect x="-95" y="44" width="325" height="240" rx="8" fill="var(--tile)" stroke="var(--dim)" stroke-width="2.5" opacity=".5"/>
    <rect x="270" y="44" width="325" height="240" rx="8" fill="var(--tile)" stroke="var(--dim)" stroke-width="2.5"/>
    <rect x="605" y="44" width="325" height="240" rx="8" fill="var(--tile)" stroke="var(--accent)" stroke-width="6"/>
    <rect x="970" y="44" width="325" height="240" rx="8" fill="var(--tile)" stroke="var(--dim)" stroke-width="2.5" opacity=".5"/>
    <g font-family="DM Mono, monospace" font-size="34" fill="var(--dim)" text-anchor="middle">
      <text x="67" y="140" opacity=".5">1</text><text x="432" y="140">2</text>
      <text x="767" y="140" fill="var(--fg)">3</text><text x="1132" y="140" opacity=".5">4</text>
    </g>
  </svg>
</body>
</html>
